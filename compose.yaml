services:
  repopilot:
    build: .
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      REP_PILOT_DATA_DIR: /data
      REP_PILOT_API_TOKEN: ${REP_PILOT_API_TOKEN:?REP_PILOT_API_TOKEN must be provided by Doppler}
    volumes:
      - repopilot_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  repopilot_data:
