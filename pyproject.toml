[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repopilot"
version = "0.1.0"
description = "Evidence-grounded repository intelligence with searchable code, engineering memory, and MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RepoPilot contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "httpx>=0.27", "ruff>=0.17.2", "mypy>=1.11"]
mcp = ["mcp>=1.0,<2.0"]

[project.scripts]
repopilot = "repopilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = false
