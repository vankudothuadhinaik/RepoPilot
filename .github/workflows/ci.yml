name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/repopilot
      - run: python -m pytest --cov=src/repopilot --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
      - run: python -m compileall -q src
      - run: PYTHONPATH=src python evals/run_eval.py
      - run: PYTHONPATH=src python evals/run_ground_truth.py --root .
      - name: Live provider evaluation (optional)
        if: ${{ env.OPENAI_API_KEY != '' && matrix.python-version == '3.11' }}
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: PYTHONPATH=src python evals/run_provider_eval.py --root . --output provider-evaluation.json
      - name: Publish live provider evaluation report
        if: ${{ always() && env.OPENAI_API_KEY != '' && matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v7
        with:
          name: repopilot-live-provider-evaluation-${{ github.sha }}-py${{ matrix.python-version }}
          path: provider-evaluation.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Summarize live provider evaluation
        if: ${{ always() && env.OPENAI_API_KEY != '' && matrix.python-version == '3.11' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path('provider-evaluation.json')
          if not report.is_file():
              summary = 'Live provider evaluation did not produce a report.'
          else:
              data = json.loads(report.read_text(encoding='utf-8'))
              if data.get('status') == 'skipped':
                  summary = 'Live provider evaluation skipped: ' + str(data.get('reason', 'no reason provided'))
              else:
                  metrics = data.get('metrics', {})
                  summary = ('Live provider evaluation: **' + ('PASS' if data.get('passed') else 'FAIL') + '**\n\n'
                      + '- Positive cases: ' + str(data.get('positive_count')) + '\n'
                      + '- Negative cases: ' + str(data.get('negative_count')) + '\n'
                      + '- Provider answer rate: ' + str(metrics.get('provider_answer_rate')) + '\n'
                      + '- Supported citation rate: ' + str(metrics.get('supported_citation_rate')) + '\n\n'
                      + 'Inspect the redacted artifact for per-case results. This check does not certify semantic correctness.')
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('## Live provider evaluation\n\n' + summary + '\n')
          print(summary)
          PY
      - name: Benchmark checked-out repository
        run: PYTHONPATH=src python evals/benchmark_repository.py . --output repository_benchmark_results.json
      - name: Publish repository benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: repopilot-repository-benchmark-py${{ matrix.python-version }}-${{ github.sha }}
          path: repository_benchmark_results.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish retrieval benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: repopilot-retrieval-benchmark-py${{ matrix.python-version }}-${{ github.sha }}
          path: retrieval_benchmark_results.json
          if-no-files-found: error
          retention-days: 30

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - run: npm run build
      - name: Install Playwright for browser smoke tests
        run: npm install --no-save --ignore-scripts @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run dashboard browser tests
        run: npx playwright test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        env:
          REP_PILOT_API_TOKEN: ci-smoke-token
        run: docker compose -f compose.yaml config --quiet
      - name: Build container image
        run: docker build --tag repopilot:ci .
      - name: Smoke-test container health and bearer authentication
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name repopilot-smoke -p 127.0.0.1:8010:8000 \
            -e REP_PILOT_API_TOKEN=ci-smoke-token repopilot:ci
          trap 'docker rm -f repopilot-smoke >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8010/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          unauthenticated_status=$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8010/api/repos)
          test "$unauthenticated_status" = "401"
          authenticated_status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            -H "Authorization: Bearer ci-smoke-token" http://127.0.0.1:8010/api/repos)
          test "$authenticated_status" = "200"


  windows-security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Test Windows file safety and indexing
        run: python -m pytest tests/test_security.py tests/test_indexer.py


  optional-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[mcp]"
      - run: python -c "from repopilot.mcp_server import mcp; print('MCP server import OK')"
